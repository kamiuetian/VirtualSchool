name: Codex feature cycle

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-feature-cycle
  cancel-in-progress: false

jobs:
  implement-next-feature:
    name: Implement next ready feature
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: virtualschool-codex
    timeout-minutes: 120
    env:
      DATABASE_URL: postgresql://virtualschool:virtualschool@localhost:5432/virtualschool?schema=public

    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm a feature is ready
        id: backlog
        shell: powershell
        run: |
          $hasReady = Select-String -Path CODEX_FEATURE_BACKLOG.md -Pattern '^\|\s*\d+\s*\|\s*ready\s*\|' -Quiet
          "has_ready=$($hasReady.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "baseline_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $hasReady) {
            Write-Host 'The feature queue is complete or has no ready entries.'
          }

      - name: Install workspace dependencies
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        run: pnpm prisma:generate

      - name: Implement one feature with local Codex
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        run: |
          $prompt = @'
          Continue the event-driven feature cycle for this repository.

          Read AGENTS.md, CODEX_FEATURE_BACKLOG.md, and the relevant requirements and implementation. Select exactly the first ready backlog feature and change its status to in-progress. Implement only that feature completely, including meaningful tests and operational documentation. Preserve tenant isolation, RBAC, auditability, security controls, and compatibility.

          Run every verification command required by AGENTS.md and any feature-specific Android, browser, infrastructure, or end-to-end checks. Fix failures caused by the change. When all relevant checks pass, mark only that feature complete in CODEX_FEATURE_BACKLOG.md and record any material note. Do not commit, push, call GitHub APIs, change GitHub workflows, modify runner configuration, access credentials, or start another backlog feature. The surrounding workflow owns delivery. If blocked or unable to verify, leave the feature in-progress or blocked, explain the reason in CODEX_FEATURE_BACKLOG.md, and exit without speculative changes.
          '@
          & 'E:\GitHubActionsRunner\CodexCli\node_modules\.bin\codex.cmd' exec --ephemeral --sandbox danger-full-access $prompt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify repository checks
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        run: |
          pnpm prisma:validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure exactly one feature completed
        id: delivery
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        env:
          BASELINE_SHA: ${{ steps.backlog.outputs.baseline_sha }}
        run: |
          $status = git status --porcelain
          $head = git rev-parse HEAD
          if (-not $status -and $head -eq $env:BASELINE_SHA) {
            throw 'Codex produced neither a working-tree change nor a new commit.'
          }
          if ($head -ne $env:BASELINE_SHA) {
            $diff = git diff "$env:BASELINE_SHA..$head" -- CODEX_FEATURE_BACKLOG.md | Out-String
          } else {
            $diff = git diff -- CODEX_FEATURE_BACKLOG.md | Out-String
          }
          if ($diff -notmatch '(?m)^\+\|\s*\d+\s*\|\s*complete\s*\|') {
            throw 'Codex did not mark the implemented backlog feature complete.'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "has_working_tree_changes=$([bool]$status)".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Commit and push verified feature
        if: steps.backlog.outputs.has_ready == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $completed = Select-String -Path CODEX_FEATURE_BACKLOG.md -Pattern '^\|\s*(\d+)\s*\|\s*complete\s*\|\s*([^|]+)' | Select-Object -Last 1
          if (-not $completed) { throw 'Unable to identify the completed feature.' }
          $order = $completed.Matches[0].Groups[1].Value.Trim()
          $title = $completed.Matches[0].Groups[2].Value.Trim()
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git status --porcelain) {
            git add --all
            git commit -m "Feature ${order}: ${title}"
          } else {
            Write-Host 'Codex already created the verified feature commit; skipping duplicate commit creation.'
          }
          gh auth setup-git
          git push origin HEAD:main
