name: Autonomous feature merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autonomous-feature-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge verified feature
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'codex/feature-')
    runs-on: ubuntu-latest
    steps:
      - name: Merge successful feature or report failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.workflow_run.head_branch;
            const pulls = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: 'main',
            });
            const pull = pulls.data[0];
            if (!pull) {
              core.notice(`No open feature pull request found for ${branch}.`);
              return;
            }

            if (context.payload.workflow_run.conclusion !== 'success') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body: `Automatic merge stopped because CI concluded with **${context.payload.workflow_run.conclusion}**. Fix or rerun CI to continue the feature queue.`,
              });
              core.setFailed('The generated feature did not pass CI.');
              return;
            }

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              merge_method: 'squash',
              commit_title: pull.title,
              commit_message: `Automatically merged after the full CI workflow passed.\n\n${pull.body || ''}`,
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || 'GitHub did not merge the pull request.');
            }
