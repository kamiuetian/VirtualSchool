name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.11.0

      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate configuration
        run: terraform -chdir=infra/terraform validate

  web-api-worker:
    name: Web, API, Worker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virtualschool
          POSTGRES_PASSWORD: virtualschool
          POSTGRES_DB: virtualschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virtualschool -d virtualschool"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://virtualschool:virtualschool@localhost:5432/virtualschool?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations to CI database
        run: pnpm exec prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @virtual-school/admin exec playwright install --with-deps chromium

      - name: Admin browser regression
        run: pnpm --filter @virtual-school/admin test:e2e

      - name: Production build
        run: pnpm build

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android lint and unit tests
        run: |
          gradle :apps:android-browser:lintDebug :apps:android-browser:testDebugUnitTest \
            :apps:android-launcher:lintDebug :apps:android-launcher:testDebugUnitTest

      - name: Assemble debug APKs
        run: gradle :apps:android-browser:assembleDebug :apps:android-launcher:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            apps/android-browser/build/outputs/apk/debug/*.apk
            apps/android-launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload: never

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
