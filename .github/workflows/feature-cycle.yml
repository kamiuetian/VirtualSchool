name: Autonomous feature cycle

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autonomous-feature-cycle
  cancel-in-progress: false

jobs:
  select-feature:
    name: Select next feature
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      found: ${{ steps.select.outputs.found }}
      number: ${{ steps.select.outputs.number }}
      title: ${{ steps.select.outputs.title }}
      body_b64: ${{ steps.select.outputs.body_b64 }}
    steps:
      - name: Select and claim the oldest ready issue
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'agent:ready',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request);
            if (!issue) {
              core.notice('No open issue with the agent:ready label was found.');
              core.setOutput('found', 'false');
              return;
            }
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: issue.number, name: 'agent:ready',
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['agent:in-progress'],
            });
            core.setOutput('found', 'true');
            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title);
            core.setOutput('body_b64', Buffer.from(issue.body || '', 'utf8').toString('base64'));

  implement:
    name: Implement feature
    needs: select-feature
    if: needs.select-feature.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build feature prompt
        env:
          ISSUE_NUMBER: ${{ needs.select-feature.outputs.number }}
          ISSUE_TITLE: ${{ needs.select-feature.outputs.title }}
          ISSUE_BODY_B64: ${{ needs.select-feature.outputs.body_b64 }}
        run: |
          cp .github/codex/prompts/implement-feature.md /tmp/feature-prompt.md
          printf 'Issue #%s: %s\n\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" >> /tmp/feature-prompt.md
          printf '%s' "$ISSUE_BODY_B64" | base64 --decode >> /tmp/feature-prompt.md

      - name: Implement and verify with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/feature-prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: codex-final.md

      - name: Package the reviewed workspace change
        run: |
          rm -f codex-final.md
          git add -N .
          git diff --binary --full-index > /tmp/feature.patch
          test -s /tmp/feature.patch

      - name: Upload feature patch
        uses: actions/upload-artifact@v4
        with:
          name: feature-${{ needs.select-feature.outputs.number }}-patch
          path: /tmp/feature.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish feature pull request
    needs: [select-feature, implement]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download feature patch
        uses: actions/download-artifact@v4
        with:
          name: feature-${{ needs.select-feature.outputs.number }}-patch
          path: /tmp/feature

      - name: Apply patch and create branch
        env:
          ISSUE_NUMBER: ${{ needs.select-feature.outputs.number }}
        run: |
          git apply --index /tmp/feature/feature.patch
          branch="codex/feature-${ISSUE_NUMBER}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement feature #${ISSUE_NUMBER}"
          git push --set-upstream origin "$branch"

      - name: Open pull request
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.select-feature.outputs.number }}
          ISSUE_TITLE: ${{ needs.select-feature.outputs.title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.ISSUE_NUMBER);
            const branch = `codex/feature-${number}`;
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: `Feature #${number}: ${process.env.ISSUE_TITLE}`,
              body: `Automated implementation of #${number}.\n\nCloses #${number}\n\nMerge this PR after CI and review pass. Its merge starts the next ready feature automatically.`,
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.data.number, labels: ['agent:generated'],
            });

  requeue-on-failure:
    name: Requeue failed feature
    needs: [select-feature, implement, publish]
    if: always() && needs.select-feature.outputs.found == 'true' && (needs.implement.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Return issue to ready queue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.select-feature.outputs.number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'agent:in-progress' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['agent:ready'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `The automated feature run failed. The issue was returned to the queue. Inspect workflow run ${context.runId} before retrying.`,
            });
